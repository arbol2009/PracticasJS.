
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prácticas JavaScript</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Prácticas de JavaScript</h1>

    <div class="contenedor">
        <h2>1. Cambiador de color</h2>
        <p>Color actual: <span id="color">#ffffff</span></p>
        <button id="cambiarColor">Cambiar color</button>
    </div>

    <div class="contenedor">
        <h2>2. Contador interactivo</h2>
        <p id="numero">0</p>

        <button id="restar">Restar (-)</button>
        <button id="reiniciar">Reiniciar (0)</button>
        <button id="sumar">Sumar (+)</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
